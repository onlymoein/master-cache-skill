# nginx micro-cache in front of an app: request collapsing, stale-while-revalidate,
# stale-if-error, and a hard bypass for sessions/Authorization.
# Include inside `http { }`. Verify directive values against nginx.org for your version.
#
# Behind a tag-purging CDN, keep this as a 1–10 s micro-cache (collapsing + SIE);
# without a CDN it is the shared cache and can hold public pages longer.

proxy_cache_path /var/cache/nginx/app levels=1:2 keys_zone=app:100m max_size=10g inactive=7d use_temp_path=off;

# Session / login cookies => never serve from or store into the cache.
map $http_cookie $skip_cookie {
    default 0;
    # quoted: the regex contains `;`, which would otherwise end the directive
    "~*(^|;\s*)(session|sid|sessionid|_session|auth|remember_token|wordpress_logged_in_[^=]*|wp-postpass_[^=]*|comment_author_[^=]*|woocommerce_items_in_cart|wp_woocommerce_session_[^=]*)=" 1;
}
map $http_authorization $skip_auth {
    default 1;
    ""      0;
}
map $request_method $skip_method {
    default 1;
    GET     0;
    HEAD    0;
}
map $request_uri $skip_path {
    default 0;
    ~*^/(account|admin|checkout|cart|login|logout|api/me|wp-admin|wp-login\.php) 1;
}

upstream app_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name www.example.com;

    location / {
        proxy_cache                   app;
        proxy_cache_key               "$scheme$host$request_uri";   # host in the key: multi-domain safe
        proxy_cache_methods           GET HEAD;
        proxy_cache_valid             200 301 1s;                   # micro-cache when the origin sends no TTL
        proxy_cache_valid             404 10s;
        proxy_cache_use_stale         updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;                           # SWR
        proxy_cache_lock              on;                           # one upstream request per key
        proxy_cache_lock_timeout      5s;
        proxy_cache_revalidate        on;                           # conditional GETs to the upstream

        proxy_cache_bypass            $skip_cookie $skip_auth $skip_method $skip_path;
        proxy_no_cache                $skip_cookie $skip_auth $skip_method $skip_path;

        # nginx already refuses to store responses with Set-Cookie or private/no-store/no-cache.
        # Don't add `proxy_ignore_headers Set-Cookie Cache-Control` globally. If the origin sends
        # `Cache-Control: no-cache` for browsers on public pages, have it add `X-Accel-Expires: 5`
        # on those anonymous responses: nginx gives X-Accel-Expires priority over Cache-Control and
        # doesn't pass it to clients (verify with your nginx version).

        add_header X-Cache-Status $upstream_cache_status always;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass         http://app_upstream;
    }

    # Fingerprinted assets: long TTL at the proxy and in browsers.
    location /assets/ {
        proxy_cache       app;
        proxy_cache_valid 200 30d;
        proxy_cache_lock  on;
        proxy_hide_header Cache-Control;   # replace, don't duplicate, the upstream header
        add_header        Cache-Control "public, max-age=31536000, immutable" always;
        add_header        X-Cache-Status $upstream_cache_status always;
        proxy_pass        http://app_upstream;
    }
}

# Verify:
#   for i in 1 2; do curl -s -o /dev/null -D - http://www.example.com/ | grep -i x-cache-status; done   # MISS then HIT
#   curl -s -o /dev/null -D - -H 'Cookie: session=x' http://www.example.com/ | grep -i x-cache-status    # BYPASS
